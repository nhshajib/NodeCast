name: Build Android phone and TV APKs
on:
  workflow_dispatch:
    inputs:
      target:
        description: Android edition to build
        type: choice
        default: both
        options: [both, mobile, tv]
  push:
    branches: [cursor/release-0-6-1-3b91]
permissions:
  contents: read
jobs:
  build:
    concurrency:
      group: nodecast-android-${{ matrix.target }}
      cancel-in-progress: false
    name: Android ${{ matrix.target }} release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event_name == 'push' && '["tv"]' || inputs.target == 'mobile' && '["mobile"]' || inputs.target == 'tv' && '["tv"]' || '["mobile","tv"]') }}
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      NODECAST_TARGET: ${{ matrix.target }}
      EXPO_PUBLIC_APP_VARIANT: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run typecheck && npm test
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Compile standalone release including VLC
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64
      - name: Sign and validate APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          VERSION=$(node -p "require('./package.json').version")
          OUT="android-${NODECAST_TARGET}/NodeCast-${NODECAST_TARGET}-${VERSION}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$OUT"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUT"
          "$BUILD_TOOLS/aapt" dump badging "$OUT" > "android-${NODECAST_TARGET}/apk-manifest.txt"
          python3 scripts/verify-android.py "$OUT" "$NODECAST_TARGET" "android-${NODECAST_TARGET}/apk-manifest.txt"
          sha256sum "$OUT" > "${OUT}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: NodeCast-Android-${{ matrix.target }}
          path: |
            android-${{ matrix.target }}/*.apk
            android-${{ matrix.target }}/*.sha256
            android-${{ matrix.target }}/apk-manifest.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
  publish:
    name: Publish separate APK downloads
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: NodeCast-Android-*
          path: apks
      - name: Publish Android testing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="android-v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --draft --prerelease --title "NodeCast ${VERSION} — Android phone and TV testing" --notes-file android-mobile/RELEASE.md
          fi
          gh release upload "$TAG" apks/*/*.apk apks/*/*.sha256 --clobber
  smoke:
    name: Android TV emulator check
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NodeCast-Android-tv
          path: apk
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch offline and exercise remote keys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: tv_1080p
          disable-animations: true
          script: bash scripts/android-smoke.sh tv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NodeCast-Android-tv-emulator-check
          path: verification/android/emulator-*
          if-no-files-found: ignore
          retention-days: 30
  release:
    name: Publish Android TV download
    if: github.event_name == 'push'
    needs: [publish, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace the Android TV release download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          gh release edit "android-v${VERSION}" --prerelease --draft=false
