name: Navigation validation

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'App.tsx'
      - 'tests/**'
      - 'package*.json'
      - 'tsconfig.json'
      - '.github/workflows/navigation-checks.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'App.tsx'
      - 'tests/**'
      - 'package*.json'
      - 'tsconfig.json'
      - '.github/workflows/navigation-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navigation-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Regression tests
        run: npm test
      - name: Bundle web
        run: npx expo export --platform web --output-dir /tmp/nodecast-web
