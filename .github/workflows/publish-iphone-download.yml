name: Publish verified iPhone IPA download
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful iPhone build run ID
        required: true
      source_sha:
        description: Full source commit built by that run
        required: true
      expected_sha256:
        description: IPA SHA-256 reported by the successful packaging step
        required: true
      make_public:
        description: Publish the release after the verified upload (otherwise it stays a draft)
        type: boolean
        default: false
  # A version-tag build is verified and published automatically when it succeeds.
  workflow_run:
    workflows: ['Build iPhone IPA for personal signing']
    types: [completed]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    defaults:
      run:
        working-directory: apps/player
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.path == '.github/workflows/ios-sideload.yml' && (startsWith(github.event.workflow_run.head_branch, 'v') || startsWith(github.event.workflow_run.head_branch, 'glowtv-v'))) }}
    runs-on: ubuntu-latest
    env:
      BUILD_RUN: ${{ inputs.build_run || github.event.workflow_run.id }}
      SOURCE_SHA: ${{ inputs.source_sha || github.event.workflow_run.head_sha }}
      MAKE_PUBLIC: ${{ github.event_name == 'workflow_run' || inputs.make_public }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Read the IPA SHA-256 from the build's packaging log
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_SHA256" ]; then echo "EXPECTED_SHA256=$INPUT_SHA256" >> "$GITHUB_ENV"; exit 0; fi
          JOB=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN/jobs" --jq '.jobs[] | select(.name == "Unsigned iPhone Release IPA") | .id')
          DIGEST=$(gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$JOB/logs" | grep -o '"sha256": "[0-9a-f]\{64\}"' | tail -1 | grep -o '[0-9a-f]\{64\}')
          test -n "$DIGEST"
          echo "EXPECTED_SHA256=$DIGEST" >> "$GITHUB_ENV"
      - name: Verify build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" > /tmp/build-run.json
          python3 - <<'PY'
          import json, os, re
          run = json.load(open('/tmp/build-run.json'))
          assert re.fullmatch(r'[0-9a-f]{40}', os.environ['SOURCE_SHA'])
          assert run['head_sha'] == os.environ['SOURCE_SHA']
          assert run['conclusion'] == 'success'
          assert run['path'] == '.github/workflows/ios-sideload.yml'
          PY
      - uses: actions/download-artifact@v4
        with:
          name: GlowTV-iPhone-IPA
          path: apps/player/existing-ipa
          run-id: ${{ env.BUILD_RUN }}
          github-token: ${{ github.token }}
      - name: Verify archived IPA and upload to existing draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, plistlib, re, zipfile
          from pathlib import Path
          version = json.loads(Path('package.json').read_text())['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version)
          ipa = next(Path('existing-ipa').rglob(f'GlowTV-{version}-unsigned.ipa'))
          digest = hashlib.sha256(ipa.read_bytes()).hexdigest()
          assert digest == os.environ['EXPECTED_SHA256']
          with zipfile.ZipFile(ipa) as archive:
              assert archive.testzip() is None
              assert 'Payload/GlowTV.app/main.jsbundle' in archive.namelist()
              info = plistlib.loads(archive.read('Payload/GlowTV.app/Info.plist'))
              assert info['CFBundleShortVersionString'] == version
              assert info['CFBundleIdentifier'] == 'com.nhshajib.nodecast'
              assert info['DTPlatformName'] == 'iphoneos'
          Path('existing-ipa/SHA256SUMS.txt').write_text(f'{digest}  {ipa.name}\n')
          minimum = info.get('MinimumOSVersion')
          assert isinstance(minimum, str) and minimum
          Path('existing-ipa/release-metadata.json').write_text(json.dumps({'sourceCommit': os.environ['SOURCE_SHA'], 'assets': {ipa.name: {'sha256': digest, 'size': ipa.stat().st_size, 'minimumOS': f'iOS {minimum} or later'}}}, indent=2)+'\n')
          print(json.dumps({'version': version, 'sha256': digest, 'bytes': ipa.stat().st_size}))
          PY
          VERSION=$(node -p "require('./package.json').version")
          TAG="ios-v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$SOURCE_SHA" --draft --prerelease --title "GlowTV ${VERSION} — iPhone" --notes "Unsigned iPhone IPA for personal signing with your own Apple account. Install steps: apps/player/iphone/README.md. Checksum: SHA256SUMS.txt."
          fi
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$TAG" "existing-ipa/GlowTV-${VERSION}-unsigned.ipa" existing-ipa/SHA256SUMS.txt existing-ipa/INSTALL.txt existing-ipa/release-metadata.json --clobber
          if [ "$MAKE_PUBLIC" = true ]; then
            # Published only after provenance, archive and checksum checks above have passed.
            gh release edit "$TAG" --draft=false
          fi
