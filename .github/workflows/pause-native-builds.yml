name: Pause native builds
on:
  push:
    branches: ['design/leaf-0.7.0']
    paths: ['.github/workflows/pause-native-builds.yml']
permissions:
  contents: read
concurrency:
  group: nodecast-ios-sideload
  cancel-in-progress: true
jobs:
  pause:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Native builds deferred by the user. Design work only.'
