name: Build iPhone IPA for personal signing

on:
  push:
    tags: ['glowtv-v*', 'v[0-9]*']
  workflow_dispatch:
    inputs:
      mode:
        description: Full release audit or isolated iPad frame capture
        type: choice
        default: full
        options: [full, ipad-capture]

permissions:
  contents: read

concurrency:
  group: nodecast-ios-sideload-${{ inputs.mode || 'full' }}
  cancel-in-progress: false

jobs:
  build:
    defaults:
      run:
        working-directory: apps/player
    name: Unsigned iPhone Release IPA
    runs-on: macos-26
    timeout-minutes: 120
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      RCT_NO_LAUNCH_PACKAGER: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/player/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check source
        run: npm run typecheck && npm test
      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install
      - name: Configure build environment
        id: native-environment
        run: |
          xcodebuild -version
          echo "xcode=$(xcodebuild -version | head -1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"
          xcrun swift --version
          pod --version
          printf 'export NODE_BINARY="%s"\n' "$(command -v node)" > ios/.xcode.env.local
      - name: Confirm the scene delegate class iOS will look up
        run: |
          python3 - <<'PY'
          import pathlib
          source = pathlib.Path('ios/GlowTV/SceneDelegate.swift').read_text()
          plist = pathlib.Path('ios/GlowTV/Info.plist').read_text()
          if '@objc(SceneDelegate)' not in source:
              raise SystemExit('SceneDelegate.swift no longer registers the Objective-C class SceneDelegate.')
          if '$(PRODUCT_MODULE_NAME).SceneDelegate' in plist:
              raise SystemExit('Info.plist still asks UIKit for the module-qualified class that is not registered.')
          if '<string>SceneDelegate</string>' not in plist:
              raise SystemExit('Info.plist does not name the registered SceneDelegate class.')
          print('scene delegate plist matches @objc(SceneDelegate)')
          PY
      - name: Restore compiled simulator dependencies
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            apps/player/ios/Pods
            apps/player/build/DerivedDataSim
          key: glowtv-ios-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-environment.outputs.xcode }}-${{ hashFiles('apps/player/package-lock.json', 'apps/player/app.json', 'apps/player/app.config.js', 'apps/player/plugins/**', 'apps/player/scripts/patch-*.cjs') }}
      - name: Install native dependencies including VLC
        working-directory: apps/player/ios
        run: pod install --repo-update
      - name: Prepare and validate the native resume test target
        run: |
          mkdir -p build
          ruby scripts/ios-resume-project.rb
          xcodebuild -workspace ios/GlowTV.xcworkspace -scheme GlowTVResume -configuration Release -sdk iphonesimulator -showBuildSettings -json CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- > build/resume-build-settings.json
          python3 - <<'PYSETTINGS'
          import json
          targets = json.load(open('build/resume-build-settings.json'))
          settings = next(row['buildSettings'] for row in targets if row['target'] == 'GlowTVResumeUITests')
          assert settings['PRODUCT_NAME'] == 'GlowTVResumeUITests'
          assert settings['EXECUTABLE_NAME'] == 'GlowTVResumeUITests'
          assert settings['WRAPPER_NAME'] == 'GlowTVResumeUITests.xctest'
          assert settings['TEST_TARGET_NAME'] == 'GlowTV'
          print('UI-test product, executable and app target names match')
          PYSETTINGS
      - name: Compile Release app for the iPhone simulator
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -workspace ios/GlowTV.xcworkspace \
            -scheme GlowTV \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedDataSim \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            build 2>&1 | tee build/xcodebuild-simulator.log
      - name: Save compiled simulator dependencies
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            apps/player/ios/Pods
            apps/player/build/DerivedDataSim
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Launch the simulator app and require it to stay open
        if: inputs.mode != 'ipad-capture'
        run: bash scripts/ios-simulator-launch.sh
      - name: Start local UI fixture service
        run: python3 scripts/ios-design-fixture.py > build/design-fixture.log 2>&1 &
      - name: Verify Home after tab navigation, suspension and cold relaunch
        if: inputs.mode != 'ipad-capture'
        run: bash scripts/ios-resume-check.sh
      - name: Capture and verify supported iPad screens
        env:
          GLOWTV_CAPTURE_DEVICE: ipad
          GLOWTV_ONLY_DESIGN: ${{ inputs.mode == 'ipad-capture' && '1' || '0' }}
        run: bash scripts/ios-resume-check.sh
      - name: Upload native resume verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GlowTV-iPhone-resume-check
          path: |
            apps/player/build/resume-captures
            apps/player/build/resume-summary.json
            apps/player/build/resume-ui.log
            apps/player/build/resume-ipad-captures
            apps/player/build/resume-ipad-summary.json
            apps/player/build/resume-ipad-ui.log
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload simulator console when launch fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GlowTV-simulator-launch
          path: |
            apps/player/build/simulator-console.txt
            apps/player/build/simulator-system.log
            apps/player/build/xcodebuild-simulator.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Compile standalone Release app for iPhone
        if: inputs.mode != 'ipad-capture'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -workspace ios/GlowTV.xcworkspace \
            -scheme GlowTV \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee build/xcodebuild.log
      - name: Validate and package IPA
        if: inputs.mode != 'ipad-capture'
        run: python3 scripts/package-unsigned-ipa.py build/DerivedData/Build/Products/Release-iphoneos/GlowTV.app build/artifacts
      - name: Upload IPA and checksum
        if: inputs.mode != 'ipad-capture'
        uses: actions/upload-artifact@v4
        with:
          name: GlowTV-iPhone-IPA
          path: apps/player/build/artifacts/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload native build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GlowTV-iOS-build-log
          path: apps/player/build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 3
