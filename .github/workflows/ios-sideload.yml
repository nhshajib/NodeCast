name: Build iPhone IPA for personal signing

on:
  workflow_dispatch:
  push:
    branches: [cursor/release-0-6-1-3b91]

permissions:
  contents: read

concurrency:
  group: nodecast-ios-sideload
  cancel-in-progress: false

jobs:
  build:
    name: Unsigned iPhone Release IPA
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      RCT_NO_LAUNCH_PACKAGER: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check source
        run: npm run typecheck && npm test
      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install
      - name: Configure build environment
        run: |
          xcodebuild -version
          xcrun swift --version
          pod --version
          printf 'export NODE_BINARY="%s"\n' "$(command -v node)" > ios/.xcode.env.local
      - name: Install native dependencies including VLC
        working-directory: ios
        run: pod install --repo-update
      - name: Compile standalone Release app for iPhone
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -workspace ios/NodeCast.xcworkspace \
            -scheme NodeCast \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee build/xcodebuild.log
      - name: Validate and package IPA
        run: python3 scripts/package-unsigned-ipa.py build/DerivedData/Build/Products/Release-iphoneos/NodeCast.app build/artifacts
      - name: Upload IPA and checksum
        uses: actions/upload-artifact@v4
        with:
          name: NodeCast-iPhone-IPA
          path: build/artifacts/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload native build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NodeCast-iOS-build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 3
  publish:
    name: Publish iPhone IPA download
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NodeCast-iPhone-IPA
          path: existing-ipa
      - name: Verify archived IPA and publish the download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, plistlib, re, zipfile
          from pathlib import Path
          version = json.loads(Path('package.json').read_text())['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version)
          ipa = next(Path('existing-ipa').rglob(f'NodeCast-{version}-unsigned.ipa'))
          recorded = Path('existing-ipa/SHA256SUMS.txt').read_text().split()[0]
          digest = hashlib.sha256(ipa.read_bytes()).hexdigest()
          assert digest == recorded
          with zipfile.ZipFile(ipa) as archive:
              assert archive.testzip() is None
              assert 'Payload/NodeCast.app/main.jsbundle' in archive.namelist()
              info = plistlib.loads(archive.read('Payload/NodeCast.app/Info.plist'))
              assert info['CFBundleShortVersionString'] == version
              assert info['CFBundleVersion'] == '601'
              assert info['CFBundleIdentifier'] == 'com.nhshajib.nodecast'
              assert info['DTPlatformName'] == 'iphoneos'
          print(json.dumps({'version': version, 'sha256': digest, 'bytes': ipa.stat().st_size}))
          PY
          VERSION=$(node -p "require('./package.json').version")
          TAG="ios-v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "NodeCast ${VERSION} — iPhone personal testing" --notes "Unsigned ${VERSION} IPA for personal signing with Impactor. Rebuilt from the current source and replaces the previous iPhone download. The Android phone APK remains 0.6.0."
          fi
          gh release upload "$TAG" existing-ipa/NodeCast-${VERSION}-unsigned.ipa existing-ipa/SHA256SUMS.txt existing-ipa/INSTALL.txt --clobber
          gh release edit "$TAG" --prerelease --draft=false
