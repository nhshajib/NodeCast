name: Build iPhone IPA for personal signing

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/fix-ios-open-crash-3b91

permissions:
  contents: read

concurrency:
  group: nodecast-ios-sideload
  cancel-in-progress: false

jobs:
  build:
    name: Unsigned iPhone Release IPA
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      RCT_NO_LAUNCH_PACKAGER: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check source
        run: npm run typecheck && npm test
      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install
      - name: Configure build environment
        run: |
          xcodebuild -version
          xcrun swift --version
          pod --version
          printf 'export NODE_BINARY="%s"\n' "$(command -v node)" > ios/.xcode.env.local
      - name: Confirm the scene delegate class iOS will look up
        run: |
          python3 - <<'PY'
          import pathlib
          source = pathlib.Path('ios/NodeCast/SceneDelegate.swift').read_text()
          plist = pathlib.Path('ios/NodeCast/Info.plist').read_text()
          if '@objc(SceneDelegate)' not in source:
              raise SystemExit('SceneDelegate.swift no longer registers the Objective-C class SceneDelegate.')
          if '$(PRODUCT_MODULE_NAME).SceneDelegate' in plist:
              raise SystemExit('Info.plist still asks UIKit for the module-qualified class that is not registered.')
          if '<string>SceneDelegate</string>' not in plist:
              raise SystemExit('Info.plist does not name the registered SceneDelegate class.')
          print('scene delegate plist matches @objc(SceneDelegate)')
          PY
      - name: Install native dependencies including VLC
        working-directory: ios
        run: pod install --repo-update
      - name: Compile Release app for the iPhone simulator
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -workspace ios/NodeCast.xcworkspace \
            -scheme NodeCast \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedDataSim \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/xcodebuild-simulator.log
      - name: Launch the simulator app and require it to stay open
        run: bash scripts/ios-simulator-launch.sh
      - name: Upload simulator console when launch fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NodeCast-simulator-launch
          path: |
            build/simulator-console.txt
            build/simulator-system.log
            build/xcodebuild-simulator.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Compile standalone Release app for iPhone
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -workspace ios/NodeCast.xcworkspace \
            -scheme NodeCast \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee build/xcodebuild.log
      - name: Validate and package IPA
        run: python3 scripts/package-unsigned-ipa.py build/DerivedData/Build/Products/Release-iphoneos/NodeCast.app build/artifacts
      - name: Upload IPA and checksum
        uses: actions/upload-artifact@v4
        with:
          name: NodeCast-iPhone-IPA
          path: build/artifacts/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload native build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NodeCast-iOS-build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 3
