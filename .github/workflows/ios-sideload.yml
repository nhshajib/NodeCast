name: Build iPhone IPA for Sideloadly

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nodecast-ios-sideload
  cancel-in-progress: false

jobs:
  build:
    name: Unsigned iPhone Release IPA
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      RCT_NO_LAUNCH_PACKAGER: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check source
        run: npm run typecheck && npm test
      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install
      - name: Configure build environment
        run: |
          xcodebuild -version
          pod --version
          printf 'export NODE_BINARY="%s"\n' "$(command -v node)" > ios/.xcode.env.local
      - name: Install native dependencies including VLC
        working-directory: ios
        run: pod install --repo-update
      - name: Compile standalone Release app for iPhone
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -workspace ios/NodeCast.xcworkspace \
            -scheme NodeCast \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee build/xcodebuild.log
      - name: Validate and package IPA
        run: python3 scripts/package-unsigned-ipa.py build/DerivedData/Build/Products/Release-iphoneos/NodeCast.app build/artifacts
      - name: Upload IPA and checksum
        uses: actions/upload-artifact@v4
        with:
          name: NodeCast-iPhone-IPA
          path: build/artifacts/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload native build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NodeCast-iOS-build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 3
