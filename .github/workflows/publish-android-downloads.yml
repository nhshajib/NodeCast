name: Publish verified GlowTV Android downloads
on:
  workflow_dispatch:
    inputs:
      edition:
        description: Publish only the verified edition; both retains the combined release
        type: choice
        default: both
        options: [both, mobile, tv]
      build_run:
        description: Successful Android phone and TV build run ID
        required: true
      check_run:
        description: Native design audit with a successful phone job using those APKs
        required: true
      tv_check_run:
        description: Optional separate run with a successful TV design job on the same APK build
        required: false
      source_sha:
        description: Full source commit built by the build run
        required: true
      make_public:
        description: Publish after verifying the selected signed APKs
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/player
    env:
      EDITION: ${{ inputs.edition || 'both' }}
      BUILD_RUN: ${{ inputs.build_run }}
      CHECK_RUN: ${{ inputs.check_run }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      TV_CHECK_RUN: ${{ inputs.tv_check_run || inputs.check_run }}
      MAKE_PUBLIC: ${{ inputs.make_public }}
      GH_TOKEN: ${{ github.token }}
      GLOWTV_ANDROID_SIGNING_CERT_SHA256: ${{ vars.GLOWTV_ANDROID_SIGNING_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Require successful builds and matching native audits
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" > /tmp/glowtv-build.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CHECK_RUN" > /tmp/glowtv-check.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TV_CHECK_RUN" > /tmp/glowtv-tv-check.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CHECK_RUN/jobs" > /tmp/glowtv-phone-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TV_CHECK_RUN/jobs" > /tmp/glowtv-tv-jobs.json
          python3 - <<'PY'
          import json,os,re
          build=json.load(open('/tmp/glowtv-build.json'));check=json.load(open('/tmp/glowtv-check.json'))
          assert re.fullmatch('[a-f0-9]{40}',os.environ['SOURCE_SHA'])
          assert build['head_sha']==os.environ['SOURCE_SHA'] and build['conclusion']=='success'
          assert build['path']=='.github/workflows/apps-release.yml'
          # Matrix editions can pass in separate runs. Require each exact job,
          # APK build and native result bundle; never accept a failed edition.
          editions=os.environ['EDITION'];assert editions in ['both','mobile','tv']
          for edition,runfile,jobsfile in [('mobile','check','phone'),('tv','tv-check','tv')]:
              if editions!='both' and edition!=editions:continue
              run=json.load(open(f'/tmp/glowtv-{runfile}.json'))
              assert run['status']=='completed' and run['path']=='.github/workflows/android-smoke.yml'
              titles=[f"Check {target} design - APK {os.environ['BUILD_RUN']} - API 35" for target in ['both',edition]]
              assert run['display_title'] in titles
              jobs=json.load(open(f'/tmp/glowtv-{jobsfile}-jobs.json'))['jobs']
              matching=[j for j in jobs if j['name']==f'smoke ({edition})']
              assert len(matching)==1 and matching[0]['conclusion']=='success',f'{edition} native audit did not pass'
          PY
      - uses: actions/download-artifact@v4
        if: inputs.edition != 'tv'
        with:
          name: GlowTV-Android-mobile-emulator-check
          path: apps/player/native-check/mobile
          run-id: ${{ inputs.check_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: inputs.edition != 'mobile'
        with:
          name: GlowTV-Android-tv-emulator-check
          path: apps/player/native-check/tv
          run-id: ${{ inputs.tv_check_run || inputs.check_run }}
          github-token: ${{ github.token }}
      - name: Require native screen, settings and playback proofs
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          selected=os.environ['EDITION']
          for edition in ['mobile','tv']:
              if selected!='both' and edition!=selected:continue
              root=Path('native-check')/edition
              result=json.loads((root/f'emulator-design-{edition}-result.json').read_text())
              assert result['native'] and result['actualVideoPixels'] and str(result['androidApi'])=='35'
              assert set(result['screens'])=={'home','guide','player','movies','series','playlists','search','settings'}
              # Connection/IP screens were deliberately removed in 1.0.2.
              # Require every remaining destination by name, not a stale count.
              playback='Default player' if edition=='mobile' else 'Playback'
              expected={'Appearance','Family controls',playback,'Library organization','Backup & transfer','Library & storage','Version history'}
              assert set(result['settingsDestinations'])==expected, (edition,result['settingsDestinations'])
          if selected in ['both','mobile']:
              phone=json.loads(Path('native-check/mobile/emulator-mobile-pause-resume.json').read_text())
              assert phone['cycles']==6 and phone['sameProcess'] and phone['originalVideoPixels']
          if selected in ['both','tv']:
              tv=json.loads(Path('native-check/tv/emulator-tv-initial-pause.json').read_text())
              assert tv['sameProcess'] and tv['remoteSelect'] and tv['dedicatedMediaKeys']
          if tuple(map(int,json.loads(Path('app.json').read_text())['expo']['version'].split('.'))) >= (1,0,3):
              for edition in ['mobile','tv']:
                  if selected!='both' and edition!=selected:continue
                  proof=json.loads((Path('native-check')/edition/f'emulator-{edition}-channel-transport.json').read_text())
                  assert proof['next'] and proof['previous'] and proof['decodedOriginalVideo'] and proof['sameProcess']
                  if edition=='tv':assert proof['remoteOnly']
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.edition == 'mobile' && 'GlowTV-Android-mobile' || inputs.edition == 'tv' && 'GlowTV-Android-tv' || 'GlowTV-Android-*' }}
          path: apps/player/apks
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - name: Verify exact archives, checksums and private release signing
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          export BUILD_TOOLS
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess,zipfile
          from pathlib import Path
          for edition,filename in [('mobile','GlowTV.apk'),('tv','GlowTV-TV.apk')]:
              if os.environ['EDITION']!='both' and edition!=os.environ['EDITION']:continue
              files=list(Path('apks').rglob(filename));assert len(files)==1
              apk=files[0];checksum=apk.with_name(filename+'.sha256').read_text().split()[0]
              assert hashlib.sha256(apk.read_bytes()).hexdigest()==checksum
              with zipfile.ZipFile(apk)as archive:assert archive.testzip()is None
              tools=Path(os.environ['BUILD_TOOLS'])
              subprocess.run(['python3','scripts/android_release_signing.py','verify',str(tools),str(apk)],check=True)
              manifest=subprocess.check_output([str(tools/'aapt'),'dump','badging',str(apk)],text=True)
              (apk.parent/'apk-manifest.txt').write_text(manifest)
              subprocess.run(['python3','scripts/verify-android.py',str(apk),edition,str(apk.parent/'apk-manifest.txt')],check=True)
          PY
          GITHUB_SHA="$SOURCE_SHA" python3 scripts/release-metadata.py apks
      - name: Attach verified files and optionally publish
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          TAG="glowtv-v${VERSION}"
          if [ "$EDITION" = mobile ]; then TAG="android-v${VERSION}"; fi
          if [ "$EDITION" = tv ]; then TAG="glowtv-android-v${VERSION}"; fi
          cat > /tmp/glowtv-android-notes.md <<'NOTES'
          GlowTV: updated live controls and launch animation.

          - Visible Previous and Next channel controls on native and VLC playback.
          - Quieter header, centered transport and bottom playback actions.
          - Only the supplied launch film, with the old native splash logo removed.
          - Reused search data and fewer catalogue rebuilds.

          This release contains only the verified edition(s) attached below. GlowTV.apk is for Android phones/tablets; GlowTV-TV.apk is for Android TV and Fire TV remotes. Installation instructions remain in the existing edition folders.

          Exact private-key-signed APKs passed native emulator design, decoded-video and playback checks. Original app identifiers and the owner-pinned signing certificate are retained. Physical-device checks were skipped by owner decision. SHA-256 files and release-metadata.json describe these exact assets.

          GlowTV is a player only and supplies no channels or subscriptions. Playback depends on your provider, stream and connection.
          NOTES
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$SOURCE_SHA" --draft --title "GlowTV ${VERSION} — Android ${EDITION}" --notes-file /tmp/glowtv-android-notes.md
          fi
          # Replacing the existing test-signed pre-release is the one-time migration.
          # Never silently overwrite a stable release.
          gh release view "$TAG" --json isDraft,isPrerelease > /tmp/glowtv-release-state.json
          python3 -c 'import json; r=json.load(open("/tmp/glowtv-release-state.json")); assert r["isDraft"] or r["isPrerelease"], "Refusing to overwrite a stable release"'
          gh release edit "$TAG" --notes-file /tmp/glowtv-android-notes.md
          gh release upload "$TAG" apks/*/*.apk apks/*/*.sha256 apks/release-metadata.json --clobber
          if [ "$MAKE_PUBLIC" = true ]; then gh release edit "$TAG" --draft=false --prerelease=false --latest; fi
