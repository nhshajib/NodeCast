name: Test Android APK startup and TV remote
run-name: Check ${{ inputs.target }} ${{ inputs.tv_suite }} - APK ${{ inputs.build_run }} - API ${{ inputs.api_level }}
on:
  workflow_run:
    workflows: ['Build Android phone and TV APKs']
    types: [completed]
    branches: ['design/leaf-0.7.0']
  workflow_dispatch:
    inputs:
      target:
        description: Android edition to check
        type: choice
        default: both
        options: [both, mobile, tv]
      build_run:
        description: Successful Android APK workflow run ID
        required: true
      tv_suite:
        description: TV remote checks (use core and settings on the same APK for split verification)
        type: choice
        default: full
        options: [full, core, settings, stability, library, input]
      api_level:
        description: Android emulator API (30 approximates Android 11 Fire TV runtime)
        type: choice
        default: '35'
        options: ['30', '35']
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.target == 'mobile' && '["mobile"]' || inputs.target == 'tv' && '["tv"]' || '["mobile","tv"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: NodeCast-Android-${{ matrix.target }}
          path: apk
          run-id: ${{ inputs.build_run || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Install video test tools
        if: matrix.target == 'tv'
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch offline and exercise remote keys
        env:
          NODECAST_TV_SUITE: ${{ inputs.tv_suite || 'full' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level || '35' }}
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.target == 'tv' && 'tv_1080p' || 'pixel_2' }}
          disable-animations: true
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/android-smoke.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NodeCast-Android-${{ matrix.target }}-emulator-check
          path: verification/android/emulator-*
          if-no-files-found: ignore
          retention-days: 30
