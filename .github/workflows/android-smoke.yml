name: Test Android APK startup and TV remote
run-name: Check ${{ inputs.target || 'both' }} ${{ inputs.tv_suite || 'core' }} - APK ${{ inputs.build_run || github.event.workflow_run.id }} - API ${{ inputs.api_level || '35' }}
on:
  # A version-tag build is checked on the emulator and, if every check passes, published.
  workflow_run:
    workflows: ['Build Android phone and TV APKs']
    types: [completed]
  workflow_dispatch:
    inputs:
      target:
        description: Android edition to check
        type: choice
        default: both
        options: [both, mobile, tv]
      build_run:
        description: Successful Android APK workflow run ID
        required: true
      tv_suite:
        description: TV remote checks (use core and settings on the same APK for split verification)
        type: choice
        default: full
        options: [full, core, settings, stability, library, input, design]
      api_level:
        description: Android emulator API (30 approximates Android 11 Fire TV runtime)
        type: choice
        default: '35'
        options: ['30', '35']
      gpu_mode:
        description: Emulator graphics backend (compare native TextureView rendering)
        type: choice
        default: swangle
        options: [swangle, swiftshader_indirect]
      disable_codec2:
        description: Isolate the emulator's virtual Codec2 decoder (app settings unchanged)
        type: boolean
        default: false
      disable_vulkan:
        description: Disable the emulator Vulkan path for native video comparison
        type: boolean
        default: false
      make_public:
        description: Publish the android-v<version> release once these emulator checks pass
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.path == '.github/workflows/apps-release.yml' && (startsWith(github.event.workflow_run.head_branch, 'v') || startsWith(github.event.workflow_run.head_branch, 'glowtv-v'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.target == 'mobile' && '["mobile"]' || inputs.target == 'tv' && '["tv"]' || '["mobile","tv"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: GlowTV-Android-${{ matrix.target }}
          path: apps/player/apk
          run-id: ${{ inputs.build_run || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Install video test tools
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Record emulator feature support
        run: |
          mkdir -p apps/player/verification/android
          "$ANDROID_HOME/emulator/emulator" -feature-list > apps/player/verification/android/emulator-host-features.txt 2>&1 || true
      - name: Launch offline and exercise remote keys
        env:
          NODECAST_TV_SUITE: ${{ inputs.tv_suite || 'core' }}
          GLOWTV_EMULATOR_GPU: ${{ inputs.gpu_mode || 'swangle' }}
          GLOWTV_EMULATOR_DISABLE_CODEC2: ${{ inputs.disable_codec2 && 'true' || 'false' }}
          GLOWTV_EMULATOR_VULKAN: ${{ inputs.disable_vulkan && 'disabled' || 'default' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level || '35' }}
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.target == 'tv' && 'tv_1080p' || 'pixel_2' }}
          # Exercise the real native transition completion path and hit testing.
          disable-animations: false
          emulator-options: -no-window -gpu ${{ inputs.gpu_mode || 'swangle' }} -no-snapshot -noaudio -no-boot-anim ${{ inputs.disable_vulkan && '-feature -Vulkan' || '' }} ${{ inputs.disable_codec2 && '-feature -VideoPlayback' || '' }}
          script: cd apps/player && if [ "${{ inputs.tv_suite }}" = design ]; then python3 ../../verification/glowtv/android-capture.py ${{ matrix.target }}; else bash scripts/android-smoke.sh ${{ matrix.target }}; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GlowTV-Android-${{ matrix.target }}-emulator-check
          path: apps/player/verification/android/emulator-*
          if-no-files-found: ignore
          retention-days: 30
  publish:
    name: Publish Android release after emulator checks
    defaults:
      run:
        working-directory: apps/player
    needs: smoke
    if: ${{ needs.smoke.result == 'success' && (github.event_name == 'workflow_run' || (inputs.make_public && inputs.target == 'both')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Confirm both APKs and checksums are attached, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="glowtv-v${VERSION}"
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for NAME in "GlowTV.apk" "GlowTV.apk.sha256" "GlowTV-TV.apk" "GlowTV-TV.apk.sha256" "release-metadata.json"; do
            grep -qx "$NAME" <<<"$ASSETS" || { echo "Missing $NAME on $TAG"; exit 1; }
          done
          gh release edit "$TAG" --draft=false
