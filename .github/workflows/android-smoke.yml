name: Test Android APK startup and TV remote
run-name: Check ${{ inputs.target }} ${{ inputs.tv_suite }} - APK ${{ inputs.build_run }} - API ${{ inputs.api_level }}
on:
  workflow_dispatch:
    inputs:
      target:
        description: Android edition to check
        type: choice
        default: both
        options: [both, mobile, tv]
      build_run:
        description: Successful Android APK workflow run ID
        required: true
      tv_suite:
        description: TV remote checks (use core and settings on the same APK for split verification)
        type: choice
        default: full
        options: [full, core, settings, stability, library, input]
      api_level:
        description: Android emulator API (30 approximates Android 11 Fire TV runtime)
        type: choice
        default: '35'
        options: ['30', '35']
      make_public:
        description: Publish the android-v<version> release once these emulator checks pass
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.target == 'mobile' && '["mobile"]' || inputs.target == 'tv' && '["tv"]' || '["mobile","tv"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NodeCast-Android-${{ matrix.target }}
          path: apk
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - name: Install video test tools
        if: matrix.target == 'tv'
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch offline and exercise remote keys
        env:
          NODECAST_TV_SUITE: ${{ inputs.tv_suite || 'full' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level || '35' }}
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.target == 'tv' && 'tv_1080p' || 'pixel_2' }}
          disable-animations: true
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/android-smoke.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NodeCast-Android-${{ matrix.target }}-emulator-check
          path: verification/android/emulator-*
          if-no-files-found: ignore
          retention-days: 30
  publish:
    name: Publish Android release after emulator checks
    needs: smoke
    if: ${{ inputs.make_public && inputs.target == 'both' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Confirm both APKs and checksums are attached, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="android-v${VERSION}"
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for NAME in "NodeCast-mobile-${VERSION}.apk" "NodeCast-mobile-${VERSION}.apk.sha256" "NodeCast-tv-${VERSION}.apk" "NodeCast-tv-${VERSION}.apk.sha256"; do
            grep -qx "$NAME" <<<"$ASSETS" || { echo "Missing $NAME on $TAG"; exit 1; }
          done
          gh release edit "$TAG" --draft=false
