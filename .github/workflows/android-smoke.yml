name: Test Android APK startup and TV remote
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Android APK workflow run ID
        required: true
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [mobile, tv]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NodeCast-Android-${{ matrix.target }}
          path: apk
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Ensure local test-video encoder
        if: matrix.target == 'tv'
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      - name: Launch offline and exercise remote keys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.target == 'tv' && 'tv_1080p' || 'pixel_2' }}
          disable-animations: true
          script: bash scripts/android-smoke.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NodeCast-Android-${{ matrix.target }}-emulator-check
          path: verification/android/emulator-*
          if-no-files-found: ignore
          retention-days: 30
