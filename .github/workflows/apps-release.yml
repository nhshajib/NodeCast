name: Build Android phone and TV APKs
on:
  push:
    tags: ['glowtv-v*', 'v[0-9]*']
  workflow_dispatch:
    inputs:
      target:
        description: Android edition to build
        type: choice
        default: both
        options: [both, mobile, tv]
      create_draft:
        description: Attach verified APKs to a draft GitHub Release
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    defaults:
      run:
        working-directory: apps/player
    concurrency:
      group: nodecast-android-${{ matrix.target }}
      cancel-in-progress: false
    name: Android ${{ matrix.target }} release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.target == 'mobile' && '["mobile"]' || inputs.target == 'tv' && '["tv"]' || '["mobile","tv"]') }}
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      NODECAST_TARGET: ${{ matrix.target }}
      EXPO_PUBLIC_APP_VARIANT: ${{ matrix.target }}
      GLOWTV_ANDROID_SIGNING_CERT_SHA256: ${{ vars.GLOWTV_ANDROID_SIGNING_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Require private release signing configuration
        env:
          KEYSTORE: ${{ secrets.GLOWTV_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.GLOWTV_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GLOWTV_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GLOWTV_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo 'Configure private release signing; see docs/ANDROID-RELEASE-SIGNING.md'; exit 1; }
          python3 -c 'import sys; sys.path.insert(0,"scripts"); from android_release_signing import expected_certificate; expected_certificate()'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/player/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run typecheck && npm test
      - name: Signing policy regression tests
        run: python3 -m unittest discover -s scripts -p test_android_release_signing.py -v
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Compile standalone release including VLC
        working-directory: apps/player/android
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 --stacktrace '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError' -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64
      - name: Sign and validate APK
        env:
          GLOWTV_ANDROID_KEYSTORE_BASE64: ${{ secrets.GLOWTV_ANDROID_KEYSTORE_BASE64 }}
          GLOWTV_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.GLOWTV_ANDROID_KEYSTORE_PASSWORD }}
          GLOWTV_ANDROID_KEY_ALIAS: ${{ secrets.GLOWTV_ANDROID_KEY_ALIAS }}
          GLOWTV_ANDROID_KEY_PASSWORD: ${{ secrets.GLOWTV_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          VERSION=$(node -p "require('./package.json').version")
          ASSET="GlowTV.apk"
          if [ "$NODECAST_TARGET" = tv ]; then ASSET="GlowTV-TV.apk"; fi
          OUT="android-${NODECAST_TARGET}/${ASSET}"
          python3 scripts/android_release_signing.py sign "$BUILD_TOOLS" android/app/build/outputs/apk/release/app-release.apk "$OUT"
          "$BUILD_TOOLS/aapt" dump badging "$OUT" > "android-${NODECAST_TARGET}/apk-manifest.txt"
          python3 scripts/verify-android.py "$OUT" "$NODECAST_TARGET" "android-${NODECAST_TARGET}/apk-manifest.txt"
          sha256sum "$OUT" > "${OUT}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: GlowTV-Android-${{ matrix.target }}
          path: |
            apps/player/android-${{ matrix.target }}/*.apk
            apps/player/android-${{ matrix.target }}/*.sha256
            apps/player/android-${{ matrix.target }}/apk-manifest.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
  publish:
    if: inputs.create_draft || startsWith(github.ref, 'refs/tags/')
    defaults:
      run:
        working-directory: apps/player
    name: Publish separate APK downloads
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: GlowTV-Android-*
          path: apps/player/apks
      - name: Publish Android release (draft until emulator checks pass)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="glowtv-v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --draft --title "GlowTV ${VERSION} — Android phone and TV" --notes-file android-mobile/RELEASE.md
          fi
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true || { echo 'Never replace a published release before exact native checks; use the verified publication workflow.'; exit 1; }
          python3 scripts/release-metadata.py apks
          for FILE in apks/*/*.apk apks/*/*.sha256 apks/release-metadata.json; do
            UPLOADED=0
            for ATTEMPT in 1 2 3 4; do
              if gh release upload "$TAG" "$FILE" --clobber; then UPLOADED=1; break; fi
              sleep "$((ATTEMPT * 5))"
            done
            test "$UPLOADED" = 1
          done
