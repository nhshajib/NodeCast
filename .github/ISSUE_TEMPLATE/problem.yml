name: Report a problem
description: Help us reproduce a GlowTV app issue.
body:
  - type: markdown
    attributes:
      value: Never include provider passwords, full playlist URLs, access tokens or unredacted logs.
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → Version history
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device model and OS version
    validations:
      required: true
  - type: input
    id: engine
    attributes:
      label: Playback engine, if relevant
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce, expected result and actual result
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Does another channel or movie work? What have you tried?
